<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Eduarda Silva (thinkmadu)</title>
    <meta
      name="description"
      content="Se encontro um problema, desenvolvo a solução. De ponta a ponta, sem deixar nada solto."
    />
    <meta name="author" content="Eduarda Silva" />
    <!-- única cor fora dos tokens: o navegador lê theme-color antes do CSS (igual a --fundo) -->
    <meta name="theme-color" content="#111012" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Eduarda Silva (thinkmadu)" />
    <meta
      property="og:description"
      content="Se encontro um problema, desenvolvo a solução. De ponta a ponta, sem deixar nada solto."
    />
    <meta property="og:url" content="https://thinkmadu.github.io/Portfolio/" />
    <!-- canonical entra pelo src/i18n (um por idioma); o HTML fixo é a versão em português -->
    <link
      rel="alternate"
      hreflang="pt-BR"
      href="https://thinkmadu.github.io/Portfolio/"
    />
    <link
      rel="alternate"
      hreflang="en"
      href="https://thinkmadu.github.io/Portfolio/?lang=en"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://thinkmadu.github.io/Portfolio/"
    />
    <link rel="icon" href="src/imagens/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="src/fonts/jetbrains-mono-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="src/fonts/familjen-grotesk-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="src/estilos/index.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main>
      <h1 class="visualmente-oculto" data-i18n="doc.h1">
        Sistema solar: thinkmadu no centro, com contatos e áreas em órbita
      </h1>
      <div id="root"></div>
    </main>
  </body>
</html>
