<style>

}
html, body { height: 100%; margin: 0; background: var(--fundo); color: var(--texto); font-family: var(--font-mono); overflow: hidden; }

#root.pf-compacto .pf-assina-txt { position: absolute; left: 16px; right: 16px; top: 16px; z-index: 3; }
#root.pf-compacto .pf-menu { left: 16px; right: 16px; bottom: 16px; width: auto; height: auto; clip: auto; overflow: visible; z-index: 3; background: var(--superficie); border-radius: var(--raio-md); padding: var(--space-3); }

.pf-cartao h3{margin:0;font-family:var(--font-display);font-size:24px;line-height:1.25;font-weight:500}
.pf-cartao p{margin:0;font-size:14px;line-height:1.5}
.pf-tags{display:flex;flex-wrap:wrap;gap:var(--space-2);font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;color:var(--texto-suave)}
.pf-links{display:flex;flex-wrap:wrap;gap:var(--space-3);margin-top:auto;font-weight:700;font-size:14px}
.pf-privado{font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;color:var(--texto-suave)}
.pf-bloco{background:var(--superficie);border-radius:var(--raio-md);padding:var(--space-4)}

.pf-item{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr) auto;gap:var(--space-3);align-items:baseline;padding:var(--space-2) 0;border-top:1px solid var(--linha)}
.pf-item:first-of-type{border-top:0}
.pf-k{font-family:var(--font-mono);font-size:13px;font-weight:500}
.pf-v{font-size:14px;line-height:1.5}
.pf-item a{font-size:14px;font-weight:700;white-space:nowrap}
@media (max-width:520px){.pf-item{grid-template-columns:minmax(0,1fr)}}
.pf-cartao a,.pf-bloco a{color:var(--acento)}
.pf-menu a{color:var(--texto)}

.pf-solar{display:grid;gap:var(--space-3)}

.pf-l0{color:var(--texto-suave);opacity:calc(var(--pf-fb)*.5)}

.pf-sun{font-size:1.3em;text-shadow:0 0 2px var(--fundo),0 0 5px var(--fundo),0 0 9px var(--fundo),0 0 14px var(--fundo),0 0 calc(8px*var(--pf-gl)*var(--pf-pulse)) var(--brilho),0 0 calc(24px*var(--pf-gl)*var(--pf-pulse)) var(--brilho),0 0 calc(54px*var(--pf-gl)*var(--pf-pulse)) var(--brilho),0 0 calc(90px*var(--pf-gl)*var(--pf-pulse)) var(--brilho)}

.pf-pl:focus-visible{outline:none;box-shadow:0 0 0 2px var(--fundo),0 0 0 4px var(--foco);border-radius:var(--raio-sm)}
@property --pf-pulse{syntax:'<number>';inherits:true;initial-value:1}
@keyframes pf-pulse{0%,100%{--pf-pulse:.65}50%{--pf-pulse:1.25}}
@keyframes pf-tw{0%,100%{opacity:calc(var(--pf-fb)*.6)}50%{opacity:.55}}

#panel { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); z-index: 5; width: min(340px, calc(100% - 32px)); background: #1d1b20; border-radius: 8px; padding: 16px; display: grid; gap: 12px; font-size: 13px; }
#panel[hidden] { display: none; }
#panel label { display: grid; grid-template-columns: 84px minmax(0, 1fr) 36px; align-items: center; gap: 8px; }
#panel output { text-align: right; color: var(--texto-suave); }
#panel input[type=range] { width: 100%; accent-color: var(--acento); }
#panel button { font: 500 13px var(--font-mono); color: var(--texto); background: transparent; border: 1px solid var(--linha); border-radius: 999px; min-height: 44px; padding: 0 16px; cursor: pointer; }
#panel button:hover { color: var(--acento); }
#readout { color: var(--texto-suave); font-size: 12px; margin: 0; }
.pf-assina{position:absolute;margin:0;transform:translate(-100%,-50%);text-align:right;white-space:pre;pointer-events:none;z-index:1;color:var(--texto-suave);font-weight:500;text-shadow:0 0 2px var(--fundo),0 0 5px var(--fundo),0 0 9px var(--fundo),0 0 14px var(--fundo)}
.pf-assina-txt{display:none;margin:0;text-align:right;font-family:var(--font-mono);font-size:13px;line-height:1.5;color:var(--texto-suave)}
.pf-compacto .pf-assina-txt{display:block}
</style>

<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Sistema solar: thinkmadu no centro, com contatos e áreas em órbita</h1>
<div id="root"></div>
<div id="panel" hidden>
  <label for="s-fundo">Fundo <input id="s-fundo" type="range" min="4" max="60" step="1"><output id="o-fundo"></output></label>
  <label for="s-brilho">Brilho <input id="s-brilho" type="range" min="0" max="100" step="1"><output id="o-brilho"></output></label>
  <label for="s-orbitas">Órbitas <input id="s-orbitas" type="range" min="0" max="200" step="5"><output id="o-orbitas"></output></label>
  <label for="s-meteoros">Meteoros <input id="s-meteoros" type="range" min="0" max="100" step="1"><output id="o-meteoros"></output></label>
  <label for="s-fonte">Fonte <input id="s-fonte" type="range" min="10" max="30" step="1"><output id="o-fonte"></output></label>
  <button id="b-seed" type="button">Sortear outro fundo</button>
  <p id="readout"></p>
</div>
<script>
/* @ds-bundle: {"format":4,"namespace":"Portfolio","components":[{"name":"SistemaSolar"},{"name":"CartaoProjeto"},{"name":"BlocoFechado"}]} */
(function () {
  var NS = (window.Portfolio = window.Portfolio || {});
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function seeded(s) {
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

          /* ---------- SistemaSolar ---------- */
  var D2R = Math.PI / 180,
    TILT = -28 * D2R,
    QB = 0.42,
    QM = 0.65;
  var CAND = [0, 30, 330, 60, 300, 90, 270, 120, 240, 150, 210, 180];
  var CHARS = [
    ".",
    ".",
    ".",
    ".",
    ".",
    ".",
    "·",
    "·",
    "·",
    ":",
    ":",
    "+",
    "+",
    "*",
    ",",
    ",",
    "'",
    "`",
    "-",
    "~",
  ];
  var IN_START = 205,
    OUT_START = 130;
  // posição dos nós da constelação, em fração da meia caixa (x, y), conforme quantos nós há
  var NODE_POS = [
    [[0.8, 0.5]],
    [
      [-0.85, -0.5],
      [0.85, 0.55],
    ],
    [
      [-0.85, -0.5],
      [0.85, 0.55],
      [0.05, -0.9],
    ],
    [
      [-0.85, -0.5],
      [0.85, 0.55],
      [0.05, -0.9],
      [-0.1, 0.9],
    ],
  ];
  function spread(start, n, k) {
    return start + (360 / n) * k;
  }

  function boxOf(t, cw, lh, em) {
    return { w: (t.length + 0.7) * cw * em, h: lh * em };
  }
  function halfBox(rx, ry) {
    var c = Math.cos(TILT),
      s = Math.sin(TILT);
    return {
      w: Math.sqrt(rx * rx * c * c + ry * ry * s * s),
      h: Math.sqrt(rx * rx * s * s + ry * ry * c * c),
    };
  }
  function at(o, ang) {
    var a = (ang + (o.off || 0)) * D2R,
      ex = o.rx * Math.cos(a),
      ey = o.ry * Math.sin(a),
      c = Math.cos(TILT),
      s = Math.sin(TILT);
    return { x: o.cx + ex * c - ey * s, y: o.cy + ex * s + ey * c };
  }
  function inside(o, x, y, pad) {
    var dx = x - o.cx,
      dy = y - o.cy,
      c = Math.cos(TILT),
      s = Math.sin(TILT);
    var lx = dx * c + dy * s,
      ly = -dx * s + dy * c,
      rx = o.rx + pad,
      ry = o.ry + pad;
    return (lx * lx) / (rx * rx) + (ly * ly) / (ry * ry) < 1;
  }
  function gcd(x, y) {
    return y ? gcd(y, x % y) : x;
  }
  function ov(ax, ay, aw, ah, bx, by, bw, bh) {
    return (
      Math.abs(ax - bx) < (aw + bw) / 2 + 4 &&
      Math.abs(ay - by) < (ah + bh) / 2 + 2
    );
  }
  function widest(list, fallback) {
    var m = fallback || "";
    list.forEach(function (o) {
      o.pl.forEach(function (p) {
        if (p.t.length > m.length) m = p.t;
      });
    });
    return m;
  }
  function sunHit(orb, pl, fixed) {
    for (var a = 0; a < pl.length; a++)
      for (var g = 0; g < 360; g += 5) {
        var P = at(orb, pl[a].a + g);
        for (var i = 0; i < fixed.length; i++)
          if (
            ov(
              P.x,
              P.y,
              pl[a].w,
              pl[a].h,
              fixed[i].cx,
              fixed[i].cy,
              fixed[i].w,
              fixed[i].h,
            )
          )
            return true;
      }
    return false;
  }
  // cfg: { big: [{T, inner, pl:[{t,a,...}]}], cons: { sunM, nodes:[{t,...}] } | null, sunG }
  // L.fixed: tudo que não se mexe (sol, centro e nós da constelação); L.cons: oval invisível que envolve a constelação, com hub e nós
  function layout(cfg, fs, cw, W, H, scale, mscale, land) {
    var lh = fs * 1.17,
      mem = Math.max(0.72, 11 / fs),
      cwm = cw * mem,
      lhm = lh * mem;
    var cons = cfg.cons,
      hasCons = !!(cons && cons.nodes.length);
    var bigOut = boxOf(widest(cfg.big, cfg.sunG), cw, lh, 1);
    var C = null,
      big;
    if (hasCons) {
      var widestNode = cons.sunM;
      cons.nodes.forEach(function (n) {
        if (n.t.length > widestNode.length) widestNode = n.t;
      });
      var cOut = boxOf(widestNode, cwm, lhm, 1);
      var mR = land
        ? Math.min(
            (0.12 * W - cOut.w / 2) / 0.93,
            (0.2 * H - cOut.h / 2) / 0.72,
          ) * mscale
        : Math.min(Math.max(16 * cw, 0.14 * W) * mscale, 0.19 * W, 0.32 * H);
      var mh = halfBox(mR, mR * QM);
      C = {
        cx: W - mh.w - cOut.w / 2 - 8,
        cy: land ? Math.max(mh.h + lhm + 8, 0.25 * H) : mh.h + lhm + 12,
        hw: mh.w,
        hh: mh.h,
        mR: mR,
      };
      big = land ? { cx: 0.373 * W, cy: 0.56 * H } : { cx: W / 2, cy: 0.6 * H };
    } else {
      big = { cx: W / 2, cy: H / 2 };
    }
    var bh1 = halfBox(1, QB),
      rB;
    if (hasCons && land)
      rB = Math.min(
        (0.33 * W - bigOut.w / 2) / bh1.w,
        (0.42 * H - bigOut.h / 2) / bh1.h,
      );
    else
      rB = Math.min(
        (Math.min(big.cx, W - big.cx) - bigOut.w / 2 - 8) / bh1.w,
        (Math.min(big.cy, H - big.cy) - bigOut.h / 2 - 8) / bh1.h,
      );
    rB = Math.max(30, rB) * scale;
    var suns = [
      {
        cx: big.cx,
        cy: big.cy,
        w: (cfg.sunG.length + 0.7) * cw * 1.3,
        h: lh * 1.3,
      },
    ];
    var fixed = [suns[0]],
      consOut = null;
    if (hasCons) {
      var hub = {
        cx: C.cx,
        cy: C.cy,
        w: (cons.sunM.length + 0.7) * cwm * 1.1,
        h: lhm * 1.1,
      };
      suns.push(hub);
      fixed.push(hub);
      var pos = NODE_POS[Math.min(cons.nodes.length, 4) - 1],
        nodes = [];
      cons.nodes.slice(0, 4).forEach(function (n, k) {
        var b = boxOf(n.t, cwm, lhm, 1);
        var x = C.cx + pos[k][0] * Math.max(0, C.hw - b.w / 2),
          y = C.cy + pos[k][1] * Math.max(0, C.hh);
        var node = {
          t: n.t,
          rotulo: n.rotulo,
          href: n.href,
          atual: n.atual,
          cx: x,
          cy: y,
          w: b.w,
          h: b.h,
        };
        nodes.push(node);
        fixed.push(node);
      });
      consOut = {
        cx: C.cx,
        cy: C.cy,
        rx: C.mR,
        ry: C.mR * QM,
        nodes: nodes,
        hub: hub,
      };
    }
    var sigBox = null;
    if (cfg.sig && cfg.sig.length) {
      var sw = 0;
      cfg.sig.forEach(function (l) {
        if (l.length > sw) sw = l.length;
      });
      sigBox = {
        w: (sw + 0.7) * cwm,
        h: cfg.sig.length * lhm,
        cwm: cwm,
        lines: cfg.sig,
      };
      sigBox.cx = W - sigBox.w / 2 - 12;
      sigBox.cy = H - sigBox.h / 2 - 10;
      fixed.push(sigBox);
    }
    var orbits = [];
    cfg.big.forEach(function (o) {
      var pl = o.pl.map(function (p) {
        var b = boxOf(p.t, cw, lh, 1);
        return {
          t: p.t,
          a: p.a,
          rotulo: p.rotulo,
          href: p.href,
          atual: p.atual,
          w: b.w,
          h: b.h,
        };
      });
      var rx = rB;
      if (o.inner) {
        for (var f = 0.5; f <= 0.8501; f += 0.05) {
          rx = f * rB;
          if (!sunHit({ cx: big.cx, cy: big.cy, rx: rx, ry: rx * QB }, pl, fixed))
            break;
        }
      }
      orbits.push({
        off: 0,
        cx: big.cx,
        cy: big.cy,
        rx: rx,
        ry: rx * QB,
        T: o.T,
        pl: pl,
      });
    });
    return {
      fs: fs,
      cw: cw,
      lh: lh,
      mem: mem,
      W: W,
      H: H,
      suns: suns,
      fixed: fixed,
      orbits: orbits,
      cons: consOut,
      hasCons: hasCons,
      sig: sigBox,
    };
  }
  function staticConflict(L) {
    var i, a, b, p, q, P, Q, s, o1, g, n;
    for (i = 0; i < L.orbits.length; i++) {
      o1 = L.orbits[i];
      for (a = 0; a < o1.pl.length; a++) {
        p = o1.pl[a];
        for (g = 0; g < 360; g += 5) {
          P = at(o1, p.a + g);
          if (
            P.x - p.w / 2 < 2 ||
            P.x + p.w / 2 > L.W - 2 ||
            P.y - p.h / 2 < 2 ||
            P.y + p.h / 2 > L.H - 2
          )
            return true;
          for (s = 0; s < L.fixed.length; s++)
            if (
              ov(
                P.x,
                P.y,
                p.w,
                p.h,
                L.fixed[s].cx,
                L.fixed[s].cy,
                L.fixed[s].w,
                L.fixed[s].h,
              )
            )
              return true;
          for (b = a + 1; b < o1.pl.length; b++) {
            q = o1.pl[b];
            Q = at(o1, q.a + g);
            if (ov(P.x, P.y, p.w, p.h, Q.x, Q.y, q.w, q.h)) return true;
          }
        }
      }
    }
    for (i = 0; i < L.fixed.length; i++) {
      n = L.fixed[i];
      if (
        n.cx - n.w / 2 < 2 ||
        n.cx + n.w / 2 > L.W - 2 ||
        n.cy - n.h / 2 < 2 ||
        n.cy + n.h / 2 > L.H - 2
      )
        return true;
      for (a = i + 1; a < L.fixed.length; a++)
        if (
          ov(
            n.cx,
            n.cy,
            n.w,
            n.h,
            L.fixed[a].cx,
            L.fixed[a].cy,
            L.fixed[a].w,
            L.fixed[a].h,
          )
        )
          return true;
    }
    if (L.sig) {
      var lines = L.orbits.concat(L.cons ? [L.cons] : []);
      for (i = 0; i < lines.length; i++)
        for (g = 0; g < 360; g += 2) {
          P = at(lines[i], g);
          if (
            Math.abs(P.x - L.sig.cx) < L.sig.w / 2 + 6 &&
            Math.abs(P.y - L.sig.cy) < L.sig.h / 2 + 6
          )
            return true;
        }
    }
    if (L.hasCons) {
      var gOut = L.orbits[L.orbits.length - 1],
        mOut = L.cons,
        pad = 2 * L.cw;
      for (g = 0; g < 360; g += 3) {
        P = at(gOut, g);
        Q = at(mOut, g);
        if (inside(mOut, P.x, P.y, pad) || inside(gOut, Q.x, Q.y, pad))
          return true;
      }
    }
    return false;
  }
  function pairConflict(o1, o2) {
    var per = (o1.T * o2.T) / gcd(o1.T, o2.T),
      a,
      b,
      t,
      P,
      Q,

            opts.aoEscolher(a.getAttribute("data-r"));
          }
        });
      }
      var timer = null,
        ro = null;
      function redraw() {
        clearTimeout(timer);
        timer = setTimeout(draw, 120);
      }
      if (window.ResizeObserver) {
        ro = new ResizeObserver(redraw);
        ro.observe(skyEl);
      } else window.addEventListener("resize", redraw);
      draw();
      if (document.fonts && document.fonts.ready)
        document.fonts.ready.then(function () {
          cwCache = {};
          fitCache = {};
          draw();
        });
      rafId = requestAnimationFrame(frame);
      return {
        destroy: function () {
          alive = false;
          cancelAnimationFrame(rafId);
          if (ro) ro.disconnect();
          clearTimeout(timer);
        },
      };
    },
  };

  NS.CartaoProjeto = {
    mount: function (target, projetos) {
      target.classList.add('pf-cartoes');
      target.innerHTML = projetos.map(function (p) {
        var tags = (p.tecnologias || []).slice(0, 4).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('');
        var links = '<a href="' + esc(p.casoHref || '#') + '">Ver o caso</a>';
        if (!p.fechado && p.repoHref) links += '<a href="' + esc(p.repoHref) + '">Abrir o repositório</a>';
        return '<article class="pf-cartao"><h3>' + esc(p.titulo) + '</h3><p>' + esc(p.resumo) + '</p>' +
          '<div class="pf-tags">' + tags + '</div><div class="pf-links">' + links + '</div>' +
          (p.fechado ? '<div class="pf-privado">código privado</div>' : '') + '</article>';
      }).join('');
    }
  };

  NS.BlocoFechado = {
    mount: function (target, opts) {
      target.classList.add('pf-bloco');
      target.innerHTML = '<h2>' + esc(opts.titulo || 'O que está fechado neste projeto') + '</h2>' +
        opts.itens.map(function (i) {
          return '<div class="pf-item"><span class="pf-k">' + esc(i.rotulo) + '</span><span class="pf-v">' + esc(i.texto) +
            '</span><a href="' + esc(i.href || '#') + '">' + esc(i.link) + '</a></div>';
        }).join('');
    }
  };
})();

(function () {
  var S = { fundo: 11, brilho: 49, orbitas: 85, meteoros: 100, fonte: 22, seed: 7 }, lang = 'português', inst = null, timer = null;
  try { var sv = JSON.parse(localStorage.getItem('sol-v5') || 'null'); if (sv) for (var k in S) if (typeof sv[k] === 'number') S[k] = sv[k]; if (sv && sv.lang) lang = sv.lang; } catch (e) {}
  function save() { try { localStorage.setItem('sol-v5', JSON.stringify(Object.assign({ lang: lang }, S))); } catch (e) {} }
  var pn = document.getElementById('panel');
  function mount() {
    if (inst) inst.destroy();
    inst = Portfolio.SistemaSolar.mount(document.getElementById('root'), {
      fundo: S.fundo, brilho: S.brilho, orbitas: S.orbitas, meteoros: S.meteoros, fonte: S.fonte, seed: S.seed,
      assinatura: lang === 'english' ? ['If I find a problem,', 'I build the solution.', 'End to end,', 'no loose ends.'] : undefined,
      secundario: { centro: 'ajustes', centroHref: '#ajustes', nos: [{ rotulo: 'português', href: '#pt', atual: lang === 'português' }, { rotulo: 'english', href: '#en', atual: lang === 'english' }] },
      aoEscolher: function (r) {
        if (r === 'ajustes') pn.hidden = !pn.hidden;
        else if (r === 'português' || r === 'english') { lang = r; save(); mount(); }
      }
    });
    document.getElementById('readout').textContent = 'fundo ' + S.fundo + ' · brilho ' + S.brilho + ' · órbitas ' + S.orbitas + ' · meteoros ' + S.meteoros + ' · fonte ' + S.fonte + ' · semente ' + S.seed;
  }
  function bind(id) {
    var el = document.getElementById('s-' + id), o = document.getElementById('o-' + id);
    el.value = S[id]; o.textContent = S[id];
    el.addEventListener('input', function () { S[id] = Number(el.value); o.textContent = S[id]; save(); clearTimeout(timer); timer = setTimeout(mount, 80); });
  }
  ['fundo', 'brilho', 'orbitas', 'meteoros', 'fonte'].forEach(bind);
  document.getElementById('b-seed').addEventListener('click', function () { S.seed = Math.floor(Math.random() * 9000) + 1; save(); mount(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') pn.hidden = true; });
  mount();
})();
</script>
